# ============================================================
# WorkBridge - Sicherheits-Kopfzeilen fuer nginx
# Einbinden mit:  include /pfad/zu/security-headers.conf;
# Diese Kopfzeilen ergaenzen die CSP im HTML. Vier davon wirken
# ausschliesslich als HTTP-Header und koennen nicht per <meta>
# gesetzt werden: frame-ancestors, HSTS, X-Content-Type-Options
# und Permissions-Policy.
# ============================================================

# --- Transportverschluesselung erzwingen (erst setzen, wenn HTTPS laeuft) ---
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# --- Inhaltsrichtlinie: nur eigene Quellen, kein Inline-Code ---
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;

# --- Einbetten in fremde Seiten unterbinden (Clickjacking) ---
add_header X-Frame-Options "DENY" always;

# --- Kein Erraten von Dateitypen ---
add_header X-Content-Type-Options "nosniff" always;

# --- Herkunft nur eingeschraenkt uebermitteln ---
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- Geraetezugriffe abschalten, die die Anwendung nicht braucht ---
# Kamera und Mikrofon bleiben fuer die eigene Domain erlaubt (Videointerview).
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), interest-cohort=()" always;

# --- Isolation gegen Angriffe ueber andere Ursprungsquellen ---
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# --- Serverkennung reduzieren ---
server_tokens off;

# --- Sitzungscookies (im Anwendungsserver setzen) ---
# Set-Cookie: wb_session=...; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=1800

# --- Beispiel fuer Ratenbegrenzung der Anmeldung ---
# limit_req_zone $binary_remote_addr zone=anmeldung:10m rate=5r/m;
# location /api/login { limit_req zone=anmeldung burst=3 nodelay; }

# --- security.txt ausliefern ---
# location = /.well-known/security.txt { default_type text/plain; }

# --- App (installierbare Web-App) -------------------------------------------
# Der Offline-Speicher (sw.js) und das Manifest duerfen NIE lange
# zwischengespeichert werden. Sonst bekommt die installierte App ueber Tage
# keine neue Fassung - der Browser prueft sw.js nur, wenn er sie neu laedt.
#
# ACHTUNG, nginx-Eigenheit: Ein "add_header" innerhalb eines location-Blocks
# loescht ALLE add_header-Zeilen von aussen - also die komplette
# Sicherheitsrichtlinie oben. Deshalb steht hier bewusst "expires" statt
# "add_header". "expires" setzt Cache-Control, ohne die Vererbung zu brechen.
location = /sw.js {
    expires epoch;                       # Cache-Control: no-cache
}
location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires epoch;
}
# Seiten ohne Langzeitspeicher: der Offline-Speicher holt sie ohnehin zuerst
# aus dem Netz. Gestempelte Dateien (?v=...) duerfen lange gespeichert werden,
# weil eine neue Fassung eine neue Adresse bekommt.
location ~* \.html$ {
    expires epoch;
}
location ~* ^/assets/.+\.(css|js|png)$ {
    expires 1y;                          # Cache-Control: max-age=31536000
}
