# WorkBridge - Sicherheits-Kopfzeilen fuer Apache (mod_headers erforderlich)
<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
  Header always set X-Frame-Options "DENY"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Cross-Origin-Resource-Policy "same-origin"
</IfModule>
ServerSignature Off

# --- App (installierbare Web-App) -------------------------------------------
# Reihenfolge ist entscheidend: Apache wendet diese Abschnitte nacheinander an,
# der spaetere gewinnt. Deshalb zuerst die allgemeine Regel fuer Dateien,
# DANACH die Ausnahmen fuer sw.js und Manifest. Andersherum wuerde sw.js ein
# Jahr lang gespeichert - und die installierte App bekaeme nie ein Update.

# 1. Gestempelte Dateien (?v=...) duerfen lange gespeichert werden
<FilesMatch "\.(css|js|png)$">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>

# 2. Seiten ohne Langzeitspeicher
<FilesMatch "\.html$">
    Header always set Cache-Control "no-cache"
</FilesMatch>

# 3. Ausnahmen - muessen am Ende stehen
<Files "manifest.webmanifest">
    ForceType application/manifest+json
    Header always set Cache-Control "no-cache"
</Files>
<Files "sw.js">
    Header always set Cache-Control "no-cache"
</Files>
