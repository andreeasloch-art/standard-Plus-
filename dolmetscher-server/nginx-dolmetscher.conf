# Den Dolmetscher unter demselben Namen ausliefern wie die Website.
#
# Warum das wichtig ist: Die Sicherheitsrichtlinie der Seite erlaubt
# Verbindungen nur zur eigenen Herkunft ("connect-src 'self'"). Laeuft
# der Dolmetscher unter derselben Adresse, muss an der Richtlinie
# nichts gelockert werden. In sp-konfig.js steht dann schlicht:
#
#     dolmetscher: '/dolmetscher/ws'

location /dolmetscher/ {
    proxy_pass http://127.0.0.1:8080/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;

    # Ein Gespraech laeuft lange - die Standardzeit von 60 Sekunden
    # wuerde es mitten im Satz abschneiden.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # Ton soll sofort durch, nicht gesammelt werden
    proxy_buffering off;
}
