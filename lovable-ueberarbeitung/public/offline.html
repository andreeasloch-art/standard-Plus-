<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6166">
<title>Keine Verbindung – Standard Plus</title>
<style>
  :root { --bg: #f6fafa; --fg: #1b2426; --muted: #586366; --akzent: #1f6166; --gold: #ffd84d; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151d1f; --fg: #eef7f7; --muted: #b3c1c3; --akzent: #84c2c5; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 26rem; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 20px 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 24px; background: var(--gold); color: #1b2426; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--akzent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/app/icon-192.png" alt="">
  <h1>Keine Internetverbindung</h1>
  <p>Standard Plus braucht eine Verbindung, um Profile und Nachrichten zu laden. Bitte prüfen Sie WLAN oder mobile Daten.</p>
  <button type="button" onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
